[package]
name = "carbon-credit-program"
version = "0.1.0"
description = "VerdiCred Stage 4 — Carbon Credit Issuance on Solana (Anchor + SPL Token-2022)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "carbon_credit_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token_2022", "associated_token"] }

[dev-dependencies]
